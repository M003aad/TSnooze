<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TSnooze</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>💤 TSnooze</h1>
    <label class="switch" title="Enable / disable the extension">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </header>

  <section class="stat">
    <div class="stat-value" id="memory">Approx. 0 MB saved</div>
    <div class="stat-sub" id="sleeping">0 tabs sleeping</div>
  </section>

  <section class="row">
    <label for="delay">Suspend tabs after</label>
    <select id="delay">
      <option value="0.5">30 seconds</option>
      <option value="1">1 minute</option>
      <option value="5">5 minutes</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">1 hour</option>
    </select>
  </section>

  <section class="row" id="account-row" hidden>
    <label for="account">Account for this tab</label>
    <select id="account">
      <option value="">Not set</option>
      <option value="0">Account 0</option>
      <option value="1">Account 1</option>
      <option value="2">Account 2</option>
      <option value="3">Account 3</option>
    </select>
  </section>

  <button id="whitelist" class="btn">Whitelist Current Site</button>
  <button id="wake" class="btn secondary">Wake All Sleeping Tabs</button>

  <p id="status" aria-live="polite"></p>
  <a href="#" id="options">Manage whitelist →</a>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
