name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r dist/tsnooze-${GITHUB_REF_NAME}.zip . -x '.git/*' '.github/*' 'node_modules/*'

      - name: Attach release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
