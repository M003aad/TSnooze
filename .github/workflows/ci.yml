name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest
        run: |
          node -e "const fs=require('fs'); const m=require('./manifest.json'); if (!m || m.manifest_version !== 3) throw new Error('manifest.json is missing or invalid'); console.log('Manifest version OK');"

      - name: Check project files exist
        run: |
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f options.html
          test -f shared.js

      - name: Install lint tooling
        run: |
          npm init -y
          npm install --save-dev eslint @eslint/js

      - name: Run ESLint
        run: npx eslint . --ext .js
