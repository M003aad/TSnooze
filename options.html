<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TSnooze – Whitelist</title>
  <style>
    :root { color-scheme: light dark; --accent: #6366f1; --border: #8884; }
    body { max-width: 520px; margin: 40px auto; padding: 0 16px; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 22px; }
    p.hint { opacity: .7; margin-top: -8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input[type=text] { flex: 1; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: transparent; color: inherit; }
    button { padding: 9px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.remove { background: transparent; color: #e5484d; border: 1px solid #e5484d55; padding: 4px 10px; font-weight: 500; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    #empty { opacity: .6; text-align: center; padding: 20px 0; }
    #msg { min-height: 20px; color: #e5484d; font-size: 13px; }
  </style>
</head>
<body>
  <h1>💤 Whitelisted sites</h1>
  <p class="hint">Tabs from these sites (and their subdomains) are never suspended.</p>

  <form id="add-form">
    <input type="text" id="site" placeholder="e.g. mail.google.com or https://github.com" autocomplete="off" />
    <button type="submit">Add</button>
  </form>
  <div id="msg"></div>

  <ul id="list"></ul>
  <div id="empty" hidden>No sites whitelisted yet.</div>

  <script src="options.js"></script>
</body>
</html>
